<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b38"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="0.5" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffc53d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="top"><polygon points="0,0 512,0 512,206 0,273"/></clipPath>
    <clipPath id="bot"><polygon points="0,297 512,230 512,512 0,512"/></clipPath>
    <clipPath id="base"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <!-- base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="40" rx="330" ry="210" fill="url(#shine)" clip-path="url(#base)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110" fill="none" stroke="#ff6a3d" stroke-opacity=".35" stroke-width="3"/>
  <!-- botão play cortado ao meio (o "corte") -->
  <g filter="url(#glow)">
    <g clip-path="url(#top)" transform="translate(-8,-10)">
      <path d="M176 128 Q176 104 198 116 L384 228 Q404 240 384 252 L198 364 Q176 376 176 352 Z" fill="url(#fire)"/>
    </g>
    <g clip-path="url(#bot)" transform="translate(8,10)">
      <path d="M176 128 Q176 104 198 116 L384 228 Q404 240 384 252 L198 364 Q176 376 176 352 Z" fill="url(#fire)"/>
    </g>
  </g>
  <!-- faísca do corte -->
  <path d="M424 150 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z" fill="#ffd56b"/>
  <circle cx="110" cy="404" r="9" fill="#ffd56b" opacity=".85"/>
  <!-- trilha de filme -->
  <g fill="#ffffff" opacity=".12">
    <rect x="72" y="72" width="34" height="22" rx="6"/><rect x="72" y="118" width="34" height="22" rx="6"/>
    <rect x="406" y="372" width="34" height="22" rx="6"/><rect x="406" y="418" width="34" height="22" rx="6"/>
  </g>
</svg>
